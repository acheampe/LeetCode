[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridtools"
version = "0.1.0"
description = "Tool to detect body of water using satellite image - counts body of water, find largest body of water, detect enclosed lake, and determine flood risk zone"
authors = [
    { name = "Emmanuel Acheampong", email = "acheampe@oregonstate.edu" }
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true